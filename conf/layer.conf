# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "openphoenux"
BBFILE_PATTERN_openphoenux = "^${LAYERDIR}/"
BBFILE_PRIORITY_openphoenux = "15"
LAYERVERSION_openphoenux = "1"
LAYERSERIES_COMPAT_openphoenux = "scarthgap"
